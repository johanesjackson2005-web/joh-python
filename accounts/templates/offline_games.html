{% load static %}

<!DOCTYPE html>

<html>

<head>

<title>
Offline Games | JMJ SOFTWARES
</title>


<style>


body{

background:
linear-gradient(
135deg,
#020617,
#14532d
);

color:white;

font-family:Segoe UI;

}



h1{

text-align:center;

padding:40px;

font-size:45px;

color:#4ade80;

}



.games{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:25px;

padding:40px;

}



.card{

background:
rgba(255,255,255,.1);

backdrop-filter:blur(15px);

border-radius:20px;

overflow:hidden;

padding-bottom:20px;

transition:.3s;

}



.card:hover{

transform:scale(1.05);

box-shadow:
0 15px 40px black;

}



.card img{

width:100%;

height:180px;

object-fit:cover;

}



.content{

padding:20px;

}



.content h2{

color:#4ade80;

}



.info{

color:#ddd;

}



.download{

display:block;

background:#22c55e;

padding:12px;

margin:20px;

border-radius:30px;

text-align:center;

text-decoration:none;

color:white;

font-weight:bold;

}



.download:hover{

background:#15803d;

}


</style>


</head>



<body>


<h1>
💻 Offline Games
</h1>



<div class="games">


{% for game in games %}



<div class="card">


{% if game.thumbnail %}

<img src="{{game.thumbnail.url}}">

{% endif %}



<div class="content">


<h2>
{{game.title}}
</h2>


<p>
{{game.description}}
</p>



<p class="info">

Version:
{{game.version}}

<br>

Size:
{{game.size}}

</p>


</div>



<a class="download"
href="{{game.download_link}}">

⬇ Download Game

</a>



</div>



{% empty %}


<h2>
No Offline Games
</h2>


{% endfor %}



</div>


</body>

</html>
