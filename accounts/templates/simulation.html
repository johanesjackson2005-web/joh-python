<style>
:root {
    --primary-color: #3b82f6;    /* Bright Electric Blue */

/* ================= NAVBAR ================= */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 20px;
    background:rgba(6, 5, 10, 0.7);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:18px;
}

.nav-links li a{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:6px;
    transition:0.3s;
}

.nav-links li a:hover{
    background:#3b82f6;
}

.menu-toggle{
    display:none;
    font-size:28px;
    cursor:pointer;
}

@media(max-width:768px){
    .menu-toggle{display:block;}
    .nav-links{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#111827;
        padding:20px;
    }
    .nav-links.active{display:flex;}
}

/* ================= SLIDESHOW ================= */
.slideshow-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    z-index:-1;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    animation:fade 100s infinite;
}

.slide:nth-child(1){animation-delay:0s;}
.slide:nth-child(2){animation-delay:20s;}
.slide:nth-child(3){animation-delay:40s;}
.slide:nth-child(4){animation-delay:60s;}
.slide:nth-child(5){animation-delay:80s;}
.slide:nth-child(6){animation-delay:100s;}
.slide:nth-child(7){animation-delay:120s;}


@keyframes fade{
    0%{opacity:0;}
    10%{opacity:1;}
    25%{opacity:1;}
    35%{opacity:0;}
    100%{opacity:0;}
}
