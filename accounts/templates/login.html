{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <div class='tools-grid'>
    <div class='login-Box'>
<form  method="POST" >
    {% csrf_token %}
    <label for="login">ACCOUNT</label>
    <div class='input-Box'>
        <h1>Username</h1>
    <input type="text" name="username" placeholder="Username" required><br>
    <h2>Password</h2>
    <input type="password" name="password" placeholder="Password" required >
    </div>
    <br>
    <button type="submit">Login</button>
    <button style="background-color: green; color: white; font-size: 20px;
          padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
            <a href="/register/" style="color: white; text-decoration: none;">Register</a>
      </button>
      <a href=/forgot-password/ style='color: #e6ff07 ; font-size: 20px'>forgot password</a>
      </div>
</div>


    <style>
.tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
}
         body {
        background-size: cover;
        display: flex;
        justify-content: center;
            align-items: center;
           
            font-family: Arial, sans-serif;
            
    background-color: #0c1b3f ;
    color: var(--text-main);
    line-height: 1.6;
    overflow-x: hidden;
}
    
    .login-Box{
            position: relative;
            width: 500px;
            height: 500px;
            background-color: #0c1b3f ;
             border: 20px ;
            border: 20px ;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
                border: 10px solid #2569e7;
        }
    .login-Box:hover {
            background-color: #0c1b3f ;
        transform: translateY(-5px);
       background: rgba(7, 45, 133, 0.85);
         box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}
        label {
            font-size: 40px;
            font-family: Arial, sans-serif;
            color: white;
            background-color:transparent;
        }
        button {
            background-color: blue;
            color: white;
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        placeholder {
            color: black;
        }
        button:hover {
            background-color: darkblue;
        }
        .input-Box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        h1{
            color: #d3c8c8;
        }
        h2{
            color: #f8eaea;
        }
    </style>
           
          </form>

         </body>
</html>
