<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<div class="box">

{% if messages %}
    {% for message in messages %}
        <p1>{{ message }}</p1>
    {% endfor %}
{% endif %}

    <h2>Forgot Password</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="email" name="email" placeholder="Enter Email">

        <button type="submit">
            Send OTP
        </button>

    </form>

</div>

</body>

<style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #0f172a;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box{
            width: 100%;
            max-width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 10px solid #a0c4c2;
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        p1{
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: block;
            text-align: center;
        }

        @media(max-width: 480px){

            .box{
                padding: 20px;
                border-width: 6px;
            }

            h2{
                font-size: 24px;
            }

            input{
                font-size: 15px;
                padding: 10px;
            }

            button{
                font-size: 15px;
                padding: 10px;
            }
        }

</style>

</html>
