<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <nav class="navbar">
    <div class="logo"><a href="/">JOHBOY SETUPS</a></div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/contactus/">Contact</a></li>
        <li><a href="/logout/">Logout</a></li>
        <li><a href="/login/">Login</a></li>
        <li><a href="/register/">Register</a></li>
        <li><a href="/forgot-password/">Forgot Password</a></li>
    </ul>
</nav>


<div class="box">

{% if messages %}
    {% for message in messages %}
        <p1>{{ message }}</p1>
    {% endfor %}
{% endif %}

    <h2>Forgot Password</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="email" name="email" placeholder="Enter Email">

        <button type="submit">
            Send OTP
        </button>
        <br><br>
        <a href="{% url 'home' %}">Back to Home</a>

    </form>

</div>
<!-- FOOTER -->

</body>

<style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #0f172a;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box{
            width: 100%;
            max-width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 10px solid #a0c4c2;
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        p1{
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: block;
            text-align: center;
        }

        @media(max-width: 480px){

            .box{
                padding: 20px;
                border-width: 6px;
            }

            h2{
                font-size: 24px;
            }

            input{
                font-size: 15px;
                padding: 10px;
            }

            button{
                font-size: 15px;
                padding: 10px;
            }
        }
        .navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 20px;
    background:rgba(6, 5, 10, 0.7);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:18px;
}

.nav-links li a{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:6px;
    transition:0.3s;
}

.nav-links li a:hover{
    background:#3b82f6;
}

.menu-toggle{
    display:none;
    font-size:28px;
    cursor:pointer;
}

@media(max-width:768px){
    .menu-toggle{display:block;}
    .nav-links{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#111827;
        padding:20px;
    }
    .nav-links.active{display:flex;}
}
/* ================= FOOTER ================= */
.footer{
    background: #000000;
    border-top:2px solid rgba(5, 2, 2, 0.19);
    padding:40px 20px;
    text-align:center;
    margin-top:50px;
}

.footer-content h3{
    color:#3b82f6;
    font-size:28px;
    margin-bottom:10px;
}

.footer-content p{
    color:#cbd5e1;
    margin:8px 0;
}

.footer-contact{
    margin:12px 0;
    font-size:16px;
    color:white;
}

.footer-contact i{
    color:#3b82f6;
    margin-right:8px;
}

.copyright{
    margin-top:20px;
    font-size:14px;
    color:#94a3b8;
}
</style>

</html>
