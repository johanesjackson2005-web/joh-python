{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

</head>

<body>

<div class="container">

    <h2>CONTACT US</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Message
        </button>

    </form>

</div>

</body>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-image:url("{% static 'image/pic7.jpg' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:Arial, sans-serif;

            padding:20px;
        }

        .container{
            width:100%;
            max-width:500px;

            background:rgba(0,0,0,0.82);

            padding:35px;

            border-radius:12px;

            border:5px solid #cef5f3;

            backdrop-filter:blur(5px);
        }

        h2{
            color:#cef5f3;
            text-align:center;
            margin-bottom:25px;
            font-size:32px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            color:#cef5f3;
            margin-bottom:8px;
            font-size:16px;
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;

            padding:14px;

            border-radius:6px;

            border:1px solid #cef5f3;

            font-size:15px;

            outline:none;
        }

        textarea{
            resize:none;
            min-height:130px;
        }

        input:focus,
        textarea:focus{
            border:2px solid #3be9e0;
        }

        button{
            width:100%;

            margin-top:20px;

            padding:14px;

            border:none;

            border-radius:6px;

            background:#3be9e0;

            color:black;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#2aa89f;
        }

        .message{
            color:#90EE90;

            background:rgba(255,255,255,0.08);

            padding:12px;

            border-radius:5px;

            margin-bottom:20px;

            text-align:center;
        }

        .errorlist{
            color:red;
            list-style:none;
            margin-top:5px;
            font-size:14px;
        }

        /* Tablet */

        @media(max-width:768px){

            .container{
                max-width:90%;
                padding:30px;
            }

            h2{
                font-size:28px;
            }
        }

        /* Phone */

        @media(max-width:480px){

            body{
                padding:15px;
            }

            .container{
                padding:22px;
            }

            h2{
                font-size:24px;
            }

            input,
            textarea{
                padding:12px;
                font-size:14px;
            }

            button{
                font-size:15px;
                padding:12px;
            }
        }

    </style>

</html>
