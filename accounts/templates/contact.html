

<div class="container">

    <h2>CONTACT US</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Message
        </button>

    </form>


{% include 'partials/contact.html' %}
{% include 'partials/footer.html' %}

</body>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-image: url("/static/image/logo1.png");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            min-height:100vh;

            font-family:Arial, sans-serif;

            padding:20px 20px 60px; /* leave space for footer */
        }

        /* ensure content starts below the fixed navbar */
        .container{
            width:100%;
            max-width:700px;
            margin:100px auto 40px; /* push down from top so navbar doesn't overlap */

            background:rgba(0,0,0,0.82);

            padding:35px;

            border-radius:12px;

            border:5px solid #cef5f3;

            backdrop-filter:blur(5px);
        }

        h2{
            color:#cef5f3;
            text-align:center;
            margin-bottom:25px;
            font-size:32px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            color:#cef5f3;
            margin-bottom:8px;
            font-size:16px;
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;

            padding:14px;

            border-radius:6px;

            border:1px solid #cef5f3;

            font-size:15px;

            outline:none;
        }

        textarea{
            resize:none;
            min-height:130px;
        }

        input:focus,
        textarea:focus{
            border:2px solid #3be9e0;
        }

        button{
            width:100%;

            margin-top:20px;

            padding:14px;

            border:none;

            border-radius:6px;

            background:#3be9e0;

            color:black;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#2aa89f;
        }

        .message{
            color:#90EE90;

            background:rgba(255,255,255,0.08);

            padding:12px;

            border-radius:5px;

            margin-bottom:20px;

            text-align:center;
        }

        .errorlist{
            color:red;
            list-style:none;
            margin-top:5px;
            font-size:14px;
        }

        /* Tablet */

        @media(max-width:768px){
            .container{
                max-width:94%;
                padding:28px;
                margin:110px auto 30px;
            }

            h2{
                font-size:28px;
            }
        }

        /* Phone */

        @media(max-width:480px){
            body{
                padding:12px 12px 80px;
            }

            .container{
                padding:18px;
                margin:120px 8px 20px;
            }

            h2{
                font-size:22px;
            }

            input,
            textarea{
                padding:10px;
                font-size:14px;
            }

            button{
                font-size:15px;
                padding:12px;
            }
        }

.navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 20px;
    background:rgba(6, 5, 10, 0.7);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:18px;
}

.nav-links li a{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:6px;
    transition:0.3s;
}

.nav-links li a:hover{
    background:#3b82f6;
}

.menu-toggle{
    display:none;
    font-size:28px;
    cursor:pointer;
}

@media(max-width:768px){
    .menu-toggle{display:block;}
    .nav-links{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#111827;
        padding:20px;
    }
    .nav-links.active{display:flex;}
}
/* ================= FOOTER ================= */
.footer{
    background: #000000;
    border-top:2px solid rgba(5, 2, 2, 0.19);
    padding:40px 20px;
    text-align:center;
    margin-top:50px;
}

.footer-content h3{
    color:#3b82f6;
    font-size:28px;
    margin-bottom:10px;
}

.footer-content p{
    color:#cbd5e1;
    margin:8px 0;
}

.footer-contact{
    margin:12px 0;
    font-size:16px;
    color:white;
}

.footer-contact i{
    color:#3b82f6;
    margin-right:8px;
}

.copyright{
    margin-top:20px;
    font-size:14px;
    color:#94a3b8;
}
.search-form {
    display: flex;
    align-items: center;
    gap: 5px;
}

.search-form input {
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    outline: none;
    width: 220px;
}

.search-form button {
    background: #3b82f6;
    border: none;
    padding: 8px 12px;
    border-radius: 50%;
    color: white;
    cursor: pointer;
}

.search-form button:hover {
    background: #2563eb;
}
    </style>

</html>
