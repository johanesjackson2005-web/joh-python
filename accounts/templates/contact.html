{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

<link rel="stylesheet" href="{% static 'css/about.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>
</head>

<body>
    <nav class="navbar">
    <div class="logo"><a href="/">JOHBOY SETUPS</a></div>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/contactus/">Contact</a></li>
        <li><a href="/logout/">Logout</a></li>
        <li><a href="/login/">Login</a></li>
        <li><a href="/register/">Register</a></li>
        <li><a href="/forgot-password/">Forgot Password</a></li>
    </ul>
</nav>


<div class="container">

    <h2>CONTACT US</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Message
        </button>

    </form>

</div>

</body>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-image:url("{% static 'image/pic7.jpg' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:Arial, sans-serif;

            padding:20px;
        }

        .container{
            width:100%;
            max-width:500px;

            background:rgba(0,0,0,0.82);

            padding:35px;

            border-radius:12px;

            border:5px solid #cef5f3;

            backdrop-filter:blur(5px);
        }

        h2{
            color:#cef5f3;
            text-align:center;
            margin-bottom:25px;
            font-size:32px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            color:#cef5f3;
            margin-bottom:8px;
            font-size:16px;
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;

            padding:14px;

            border-radius:6px;

            border:1px solid #cef5f3;

            font-size:15px;

            outline:none;
        }

        textarea{
            resize:none;
            min-height:130px;
        }

        input:focus,
        textarea:focus{
            border:2px solid #3be9e0;
        }

        button{
            width:100%;

            margin-top:20px;

            padding:14px;

            border:none;

            border-radius:6px;

            background:#3be9e0;

            color:black;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#2aa89f;
        }

        .message{
            color:#90EE90;

            background:rgba(255,255,255,0.08);

            padding:12px;

            border-radius:5px;

            margin-bottom:20px;

            text-align:center;
        }

        .errorlist{
            color:red;
            list-style:none;
            margin-top:5px;
            font-size:14px;
        }

        /* Tablet */

        @media(max-width:768px){

            .container{
                max-width:90%;
                padding:30px;
            }

            h2{
                font-size:28px;
            }
        }

        /* Phone */

        @media(max-width:480px){

            body{
                padding:15px;
            }

            .container{
                padding:22px;
            }

            h2{
                font-size:24px;
            }

            input,
            textarea{
                padding:12px;
                font-size:14px;
            }

            button{
                font-size:15px;
                padding:12px;
            }
        }

.navbar{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 20px;
    background:rgba(6, 5, 10, 0.7);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:18px;
}

.nav-links li a{
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:6px;
    transition:0.3s;
}

.nav-links li a:hover{
    background:#3b82f6;
}

.menu-toggle{
    display:none;
    font-size:28px;
    cursor:pointer;
}

@media(max-width:768px){
    .menu-toggle{display:block;}
    .nav-links{
        display:none;
        flex-direction:column;
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#111827;
        padding:20px;
    }
    .nav-links.active{display:flex;}
}
    </style>

</html>
