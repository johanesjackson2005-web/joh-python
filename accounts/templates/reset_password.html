<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>


</head>

<body>

<div class="box">

    <h2>Reset Password</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="password"
               name="password1"
               placeholder="New Password">

        <input type="password"
               name="password2"
               placeholder="Confirm Password">
 {% if messages %}
    {% for message in messages %}
        <p1>{{ message }}</p1>
    {% endfor %}
{% endif %}
        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>

    <style>

        body{
            background: #0f172a;
            font-family:Arial;
        }

        .box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            border: 10px solid #a0c4c2;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:green;
            color:white;
            border:none;
        }
 p1{
        color: red;
        font-size: 15px;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    </style>
</html>
