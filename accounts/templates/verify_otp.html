<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>

    
</head>

<body>

<div class="box">

    <h2>Verify OTP</h2>

    <form method="POST">
 {% if messages %}
    {% for message in messages %}
        <p1>{{ message }}</p1>
    {% endfor %}
{% endif %}
        {% csrf_token %}

        <input type="text" name="otp" placeholder="Enter OTP">

        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

</body>

        body{
            background: #0f172a;

         p1{

    }

    </style>

</html>
