{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Assistant — JMJ Softwares</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body{
      background:#071428;
      color:#f2f4f6;
      font-family:Segoe UI,Arial;
      min-height:100vh;
      margin:0;
    }

    .chat-wrap{
      max-width:820px;
      margin:90px auto;
      padding:20px;
    }

    .assistant-header{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
    }

    .assistant-avatar{
      width:72px;
      height:72px;
      border-radius:50%;
      object-fit:cover;
    }

    .chat-box{
      background:rgba(255,255,255,0.03);
      border-radius:12px;
      padding:16px;
      height:60vh;
      overflow:auto;
    }

    .input-row{
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    input.chat-input{
      flex:1;
      padding:10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.1);
      background:transparent;
      color:white;
    }

    button.send-btn{
      background:#0ea5a2;
      border:none;
      color:white;
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
    }

    .msg{
      margin:8px 0;
      padding:10px;
      border-radius:8px;
    }

    .msg.user{
      background:rgba(59,130,246,0.12);
      text-align:right;
    }

    .msg.bot{
      background:rgba(255,255,255,0.03);
    }

    .meta{
      font-size:0.85rem;
      color:#a9c0d6;
    }
  </style>
</head>

<body>
{% csrf_token %}
<nav class="navbar">
  <div class="logo">
    <a href="/">
      <img src="{% static 'image/logo2.png' %}" style="height:36px;border-radius:6px">
      <span style="color:white;font-weight:600">JMJ SOFTWARES</span>
    </a>
  </div>
</nav>

<div class="chat-wrap">

  <div class="assistant-header">
    <img class="assistant-avatar" src="{% static 'image/screenshot.png' %}">
    <div>
      <h2>AI Assistant</h2>
      <p class="meta">Ask about tutorials, downloads, livestreams</p>
    </div>
  </div>

  <div id="chat" class="chat-box"></div>

  <div class="input-row">
    <input id="message" class="chat-input" placeholder="Ask me anything...">
    <button id="send" class="send-btn">Send</button>
  </div>

</div>

<script src="{% static 'js/ai_assistant.js' %}"></script>

</body>
</html>
