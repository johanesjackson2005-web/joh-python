{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Assistant — JMJ Softwares</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{background:#071428;color: #f2f4f6;font-family:Segoe UI,Arial;min-height:100vh}
    .assistant-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .assistant-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.04);box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    @media (max-width:480px){.assistant-avatar{width:60px;height:60px}}
    .chat-wrap{max-width:820px;margin:90px auto;padding:20px}
    .chat-box{background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;height:60vh;overflow:auto}
    .input-row{display:flex;gap:8px;margin-top:12px}
    input.chat-input{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
    button.send-btn{background: #0ea5a2;border:none;color:#052025;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.send-btn:hover{background: #0a0de7}
    .msg{margin:8px 0;padding:10px;border-radius:8px}
    .msg.user{background:rgba(59,130,246,0.12);text-align:right}
    .msg.bot{background:rgba(255,255,255,0.03)}
    .meta{font-size:0.85rem;color:#a9c0d6;margin-bottom:6px}
    h2{font-size:1.5rem;color: #f2f4f6;margin:0}
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo"><a href="/"> <img src="{% static 'image/logo2.png' %}" alt="JMJ SOFTWARES" style="height:36px;vertical-align:middle;border-radius:6px"> <span style="margin-left:8px;color:white;font-weight:600">JMJ SOFTWARES</span></a></div>
</nav>

<div class="chat-wrap">
  <div class="assistant-header">
    <img class="assistant-avatar" src="{% if user.is_authenticated and user.profile.avatar %}{% static 'image/screenshot.png' %}{% else %}{% static 'image/screenshot.png' %}{% endif %}" alt="Assistant">
    <div>
      <h2 style="margin:0">AI Assistant</h2>
      <p class="meta" style="margin:0">Ask questions about the site, tutorials, downloads or how to use features.</p>
    </div>
  </div>
  <div id="chat" class="chat-box"></div>
  <div class="input-row">
    <input id="message" class="chat-input" placeholder="Ask me about tutorials, downloads, livestreams, contact...">
    <button id="send" class="send-btn">Send</button>
  </div>
</div>

<script src="{% static 'js/ai_assistant.js' %}"></script>
</body>
</html>
