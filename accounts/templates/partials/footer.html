<script>
	(function(){
		var openBtn = document.getElementById('ai-open');
		var modal = document.getElementById('ai-modal');
		var closeBtn = document.getElementById('ai-close');
		var popout = document.getElementById('ai-popout');
		var badge = document.getElementById('ai-badge');

		function showModal(){ modal.style.display = 'block'; badge && (badge.style.display = 'none'); badge && badge.classList.remove('pulse'); }
		function hideModal(){ modal.style.display = 'none'; }

		openBtn && openBtn.addEventListener('click', function(){ if(modal.style.display === 'none' || modal.style.display === ''){ showModal(); } else { hideModal(); } });
		closeBtn && closeBtn.addEventListener('click', function(){ hideModal(); });
		popout && popout.addEventListener('click', function(){ window.open('/ai-assistant/','_blank'); });

		// Listen for messages from iframe to toggle unread badge
		window.addEventListener('message', function(e){ try{ var d = e.data; if(d && d.type === 'ai-response'){ if(modal.style.display === 'none' || modal.style.display === '')
		{ if(badge){ badge.style.display = 'flex'; badge.classList.add('pulse'); } } else { if(badge){ badge.style.display = 'none'; badge.classList.remove('pulse');
	 } } } }catch(err){} }, false);
		
		//make widget movable
		
		function makeFloatingButtonDraggable(button){

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    button.addEventListener("mousedown", function(e){

        dragging = true;

        const rect = button.getBoundingClientRect();

        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        button.style.left = rect.left + "px";
        button.style.top = rect.top + "px";

        button.style.right = "auto";
        button.style.bottom = "auto";

        button.style.position = "fixed";

    });

    document.addEventListener("mousemove", function(e){

        if(!dragging) return;
let x = e.clientX - offsetX;
let y = e.clientY - offsetY;

x = Math.max(
    0,
    Math.min(x, window.innerWidth - button.offsetWidth)
);

y = Math.max(
    0,
    Math.min(y, window.innerHeight - button.offsetHeight)
);

button.style.left = x + "px";
button.style.top = y + "px";
        
    });

    document.addEventListener("mouseup", function(){

        dragging = false;

    });

}
const chatButton = document.getElementById("chat-widget");
const aiButton = document.getElementById("ai-widget");
if(chatButton){
    makeFloatingButtonDraggable(chatButton);
}

if(aiButton){
    makeFloatingButtonDraggable(aiButton);
}
	})();
</script>
