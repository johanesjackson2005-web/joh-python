{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Avatar</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<form method="POST">
    {% csrf_token %}

    <div class="page-header">
        <div>
            <h1>Select Your Profile Picture</h1>
            <p>Choose one avatar to continue.</p>
        </div>

        <button type="submit" id="continueBtn" disabled>
            Continue <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <div class="avatar-grid">
        {% for avatar in avatars %}
        <label class="avatar-item">
            <input
                type="radio"
                name="avatar"
                value="{{ avatar }}"
                onchange="enableButton()"
                hidden>

            <img src="{% static 'profile/' %}{{ avatar }}" alt="">
        </label>
        {% endfor %}
    </div>

</form>

<script>
function enableButton(){
    document.getElementById("continueBtn").disabled = false;
}
</script>

</body>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:30px;
}

/* HEADER */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
    gap:20px;
}

.page-header h1{
    font-size:2rem;
}

.page-header p{
    color:#cbd5e1;
    margin-top:8px;
}

/* BUTTON */

#continueBtn{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:14px 30px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

#continueBtn:hover{
    background:#1d4ed8;
}

#continueBtn:disabled{
    background:#64748b;
    cursor:not-allowed;
    opacity:.6;
}

/* GRID */

.avatar-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:25px;
}

.avatar-item{
    display:flex;
    justify-content:center;
}

.avatar-item img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:4px solid transparent;
    cursor:pointer;
    transition:.3s;
    object-fit:cover;
}

.avatar-item img:hover{
    transform:scale(1.05);
}

.avatar-item input:checked + img{
    border-color:#3b82f6;
    transform:scale(1.08);
}

/* TABLET */

@media (max-width:768px){

    .page-header{
        flex-direction:column;
        text-align:center;
    }

    #continueBtn{
        width:100%;
    }

    .avatar-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .avatar-item img{
        width:110px;
        height:110px;
    }
}

/* PHONE */

@media (max-width:480px){

    body{
        padding:20px;
    }

    .page-header h1{
        font-size:1.5rem;
    }

    .avatar-grid{
        grid-template-columns:repeat(2,1fr);
        gap:18px;
    }

    .avatar-item img{
        width:95px;
        height:95px;
    }
}
</style>
