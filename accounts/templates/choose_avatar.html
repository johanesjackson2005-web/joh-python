
{% load static %}

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<div class="page-header">

    <div>
        <h1>Select Your Profile Picture</h1>
        <p>Choose one avatar to continue.</p>
    </div>


    <button type="submit" id="continueBtn" disabled>
        Continue <i class="fas fa-arrow-right"></i>
    </button>

</div>



<div class="avatar-grid">


<!-- CUSTOM UPLOAD -->

<label for="customAvatar" class="plus-box">


<input 
    type="file"
    name="custom_avatar"
    id="customAvatar"
    accept="image/*"
    hidden
    onchange="previewAvatar(event)">


<div id="uploadPreview">

    <i class="fas fa-plus"></i>

    <span>Upload</span>

</div>


</label>




<!-- DEFAULT AVATARS -->

{% for avatar in avatars %}

<label class="avatar-item">

<input
    type="radio"
    name="avatar"
    value="{{ avatar }}"
    onchange="enableButton()"
    hidden>


<img src="{% static 'profile/' %}{{ avatar }}" alt="">

</label>


{% endfor %}


</div>


</form>



{% include 'partials/contact.html' %}
{% include 'partials/footer.html' %}
<script>

function previewAvatar(event){

    const file = event.target.files[0];

    if(!file) return;


    const reader = new FileReader();


    reader.onload = function(){

        document.getElementById("uploadPreview").innerHTML = `

            <img src="${reader.result}">

        `;


        enableButton();

    };


    reader.readAsDataURL(file);

}



function enableButton(){

    document.getElementById("continueBtn").disabled = false;

}

</script>
</body>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:30px;
}

/* HEADER */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
    gap:20px;
}

.page-header h1{
    font-size:2rem;
}

.page-header p{
    color:#cbd5e1;
    margin-top:8px;
}

/* BUTTON */

#continueBtn{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:14px 30px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

#continueBtn:hover{
    background:#1d4ed8;
}

#continueBtn:disabled{
    background:#64748b;
    cursor:not-allowed;
    opacity:.6;
}

/* GRID */

.avatar-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:25px;
}

.avatar-item{
    display:flex;
    justify-content:center;
}

.avatar-item img{
    width:140px;
    height:140px;
    border-radius:50%;
    border:4px solid transparent;
    cursor:pointer;
    transition:.3s;
    object-fit:cover;
}

.avatar-item img:hover{
    transform:scale(1.05);
}

.avatar-item input:checked + img{
    border-color:#3b82f6;
    transform:scale(1.08);
}

/* TABLET */

@media (max-width:768px){

    .page-header{
        flex-direction:column;
        text-align:center;
    }

    #continueBtn{
        width:100%;
    }

    .avatar-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .avatar-item img{
        width:110px;
        height:110px;
    }
}

/* PHONE */

@media (max-width:480px){

    body{
        padding:20px;
    }

    .page-header h1{
        font-size:1.5rem;
    }

    .avatar-grid{
        grid-template-columns:repeat(2,1fr);
        gap:18px;
    }

    .avatar-item img{
        width:95px;
        height:95px;
    }
}
.upload-avatar{
    display:flex;
    justify-content:center;
    align-items:center;
}


.plus-box{

    width:140px;
    height:140px;

    border-radius:50%;
    border:3px dashed #3b82f6;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    color:#3b82f6;
    font-size:35px;

    transition:.3s;
}


.plus-box span{
    font-size:14px;
    margin-top:5px;
}


.plus-box:hover{
    transform:scale(1.05);
    background:rgba(59,130,246,.1);
}


.plus-box img{

    width:100%;
    height:100%;

    border-radius:50%;
    object-fit:cover;

}
</style>
