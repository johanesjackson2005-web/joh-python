app = 'joh-python'
primary_region = 'jnb'
console_command = '/code/manage.py shell'

[deploy]
release_command = 'python manage.py migrate --noinput'

[env]
PORT = '8000'

[processes]
app = 'gunicorn --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker myapp.asgi:application'

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024

[[statics]]
guest_path = '/code/static'
url_prefix = '/static/'