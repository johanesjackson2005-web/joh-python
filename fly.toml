app = 'joh-python'
primary_region = 'jnb'

console_command = '/app/manage.py shell'


[deploy]
release_command = 'python manage.py migrate --noinput'


[env]
PORT = '8000'


[processes]
app = "gunicorn myapp.asgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class uvicorn.workers.UvicornWorker"


[http_service]
internal_port = 8000
force_https = true
processes = ["app"]

auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
grace_period = "30s"


[http_service.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 500


[[http_service.checks]]
interval = "30s"
timeout = "10s"
method = "GET"
path = "/"


[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024