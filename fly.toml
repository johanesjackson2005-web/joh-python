app = 'joh-python'

primary_region = 'jnb'

console_command = '/app/manage.py shell'


[deploy]
release_command = 'python manage.py migrate --noinput'


[env]
PORT = "8000"


[processes]
app = "gunicorn myapp.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 1"


[http_service]
internal_port = 8000
force_https = true
processes = ["app"]


[[http_service.checks]]
interval = "15s"
timeout = "30s"
grace_period = "180s"
method = "GET"
path = "/"


[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1