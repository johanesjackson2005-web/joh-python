app = 'joh-python'
primary_region = 'jnb'

[env]
PORT = "8000"

[processes]
app = "gunicorn myapp.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 1"

[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/"