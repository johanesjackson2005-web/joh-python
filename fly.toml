app = 'joh-python'
primary_region = 'jnb'
console_command = '/code/manage.py shell'

[deploy]
release_command = 'python manage.py migrate --noinput'

[env]
PORT = '8000'

[processes]
app = 'gunicorn --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker myapp.asgi:application'

[http_service]
internal_port = 8000
force_https = true

[http_service.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 500

[[http_service.checks]]
interval = "15s"
timeout = "5s"
method = "GET"
path = "/"
[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024

